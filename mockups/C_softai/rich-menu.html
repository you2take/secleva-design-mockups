<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secleva 案C リッチメニュー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Noto Sans JP"', 'sans-serif'] }, colors: { line: { green: '#06C755' }, sc: { teal: '#0E7C7B', tealLight: '#E8F4F4' } } } } }
    </script>
    <style>
        body { -webkit-font-smoothing: antialiased; }
        .pb-safe { padding-bottom: 28px; }
        @keyframes pulseSoft { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; } }
        .ai-pulse { animation: pulseSoft 3s ease-in-out infinite; }
    </style>
</head>
<body class="bg-zinc-100 min-h-[100dvh] flex items-center justify-center p-4">

    <div class="w-[390px] h-[844px] bg-white relative overflow-hidden rounded-[3rem] border-[12px] border-black shadow-2xl flex flex-col">
        <div class="h-[47px] flex justify-between items-center px-7 pt-2 text-[15px] font-semibold">
            <span>09:00</span>
            <div class="flex gap-1.5"><i class="ph-fill ph-cell-signal-full text-sm"></i><i class="ph-fill ph-wifi-high text-sm"></i><i class="ph-fill ph-battery-full text-base"></i></div>
        </div>
        <header class="h-[52px] bg-white border-b border-zinc-100 flex items-center justify-between px-3 shrink-0">
            <div class="flex items-center gap-2">
                <i class="ph ph-caret-left text-[24px]"></i>
                <span class="text-[16px] font-bold flex items-center gap-1.5">
                    Secleva 秘書
                    <span class="w-2 h-2 rounded-full bg-sc-teal ai-pulse"></span>
                </span>
            </div>
            <div class="flex items-center gap-3">
                <i class="ph ph-magnifying-glass text-xl"></i>
                <i class="ph ph-list text-xl"></i>
            </div>
        </header>

        <div class="flex-1 bg-white px-4 py-6 flex flex-col gap-4">
            <div class="flex justify-center">
                <span class="bg-zinc-50 border border-zinc-100 text-zinc-500 text-[11px] font-medium px-3 py-1 rounded-full">今日</span>
            </div>
            <div class="flex items-start gap-2.5 max-w-[85%]">
                <img src="../../branding/logo_C.png" alt="Secleva" class="w-9 h-9 rounded-2xl object-cover">
                <div class="bg-white border border-zinc-200 px-4 py-2.5 rounded-[18px] rounded-tl-sm text-[14px] relative shadow-[0_1px_3px_rgba(0,0,0,0.03)]">
                    <div class="absolute top-0 left-0 bottom-0 w-[2px] bg-sc-teal rounded-l-[18px]"></div>
                    <span class="ml-1">こんにちは。下のメニューから操作できます。</span>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 grid-rows-2 gap-[1px] bg-zinc-100 h-[260px] shrink-0 border-t border-zinc-100">
            <button class="bg-white flex flex-col items-center justify-center gap-2 relative">
                <div class="w-12 h-12 rounded-2xl bg-sc-tealLight flex items-center justify-center border border-sc-teal/10">
                    <i class="ph-fill ph-calendar-check text-sc-teal text-2xl"></i>
                </div>
                <span class="text-[13px] font-bold">予約一覧</span>
            </button>
            <button class="bg-white flex flex-col items-center justify-center gap-2">
                <div class="w-12 h-12 rounded-2xl bg-sc-tealLight flex items-center justify-center border border-sc-teal/10">
                    <i class="ph-fill ph-user-list text-sc-teal text-2xl"></i>
                </div>
                <span class="text-[13px] font-bold">顧客検索</span>
            </button>
            <button class="bg-white flex flex-col items-center justify-center gap-2">
                <div class="w-12 h-12 rounded-2xl bg-sc-tealLight flex items-center justify-center border border-sc-teal/10">
                    <i class="ph-fill ph-clipboard-text text-sc-teal text-2xl"></i>
                </div>
                <span class="text-[13px] font-bold">カルテ</span>
            </button>
            <button class="bg-white flex flex-col items-center justify-center gap-2">
                <div class="w-12 h-12 rounded-2xl bg-sc-tealLight flex items-center justify-center border border-sc-teal/10">
                    <i class="ph-fill ph-paper-plane-tilt text-sc-teal text-2xl"></i>
                </div>
                <span class="text-[13px] font-bold">配信</span>
            </button>
        </div>

        <div class="bg-zinc-50 border-t border-zinc-100 px-3 py-2.5 pb-safe shrink-0 flex items-center gap-3">
            <i class="ph ph-keyboard text-zinc-400 text-2xl"></i>
            <div class="flex-1 bg-white rounded-full h-9 px-4 flex items-center text-zinc-300 text-sm border border-zinc-200">メッセージを入力</div>
            <i class="ph-fill ph-microphone text-zinc-400 text-2xl"></i>
        </div>
    </div>
</body>
</html>
