<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secleva 案C 設定</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Noto Sans JP"', 'sans-serif'] }, colors: { line: { DEFAULT: '#06C755' }, sc: { teal: '#0E7C7B', tealLight: '#E8F4F4', tealLighter: 'rgba(14, 124, 123, 0.08)' } } } } }
    </script>
    <style>
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; -webkit-tap-highlight-color: transparent; }
        .touch-active:active { opacity: 0.6; transform: scale(0.98); transition: all 0.1s ease; }
    </style>
</head>
<body class="bg-zinc-100 flex justify-center w-full min-h-[100dvh] text-zinc-900">

    <main class="w-full max-w-[390px] h-[100dvh] bg-zinc-50 relative flex flex-col font-sans overflow-hidden sm:border-x sm:border-zinc-200 sm:shadow-2xl">

        <div class="h-11 w-full bg-white flex justify-between items-center px-6 text-[14px] font-medium z-50">
            <span>09:00</span>
            <div class="flex gap-1.5 items-center"><i class="ph-fill ph-cell-signal-full text-base"></i><i class="ph ph-wifi-high text-base"></i><i class="ph-fill ph-battery-full text-lg"></i></div>
        </div>

        <header class="h-14 bg-white border-b border-zinc-200 flex justify-between items-center px-3 sticky top-0 z-40">
            <a href="admin.html" class="touch-active p-2"><i class="ph ph-caret-left text-2xl"></i></a>
            <h1 class="text-base font-bold tracking-wide">設定</h1>
            <div class="w-10"></div>
        </header>

        <div class="flex-1 overflow-y-auto pb-28">
            <!-- 店舗カード -->
            <section class="bg-white p-5 mb-3 border-b border-zinc-200 flex items-center gap-4">
                <img src="../../branding/logo_C.png" alt="Secleva" class="w-14 h-14 rounded-2xl object-cover">
                <div class="flex-1 min-w-0">
                    <p class="font-bold text-base">上野リラクゼーション</p>
                    <p class="text-xs text-zinc-500 mt-0.5">マッサージ・整体 ・ Solo プラン</p>
                </div>
                <i class="ph ph-caret-right text-zinc-400 text-xl"></i>
            </section>

            <!-- 店舗運営 -->
            <p class="px-4 py-2 text-xs text-zinc-500 font-bold">店舗運営</p>
            <section class="bg-white border-y border-zinc-200 divide-y divide-zinc-100">
                <a href="#" class="flex items-center gap-3 px-4 py-3.5 touch-active">
                    <i class="ph ph-storefront text-xl text-sc-teal w-6"></i>
                    <span class="flex-1 text-sm">店舗情報</span>
                    <i class="ph ph-caret-right text-zinc-400"></i>
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3.5 touch-active">
                    <i class="ph ph-tag text-xl text-sc-teal w-6"></i>
                    <span class="flex-1 text-sm">業種テンプレ</span>
                    <span class="text-xs text-zinc-500">マッサージ</span>
                    <i class="ph ph-caret-right text-zinc-400"></i>
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3.5 touch-active">
                    <i class="ph ph-clock text-xl text-sc-teal w-6"></i>
                    <span class="flex-1 text-sm">営業時間</span>
                    <span class="text-xs text-zinc-500">10:00〜20:00</span>
                    <i class="ph ph-caret-right text-zinc-400"></i>
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3.5 touch-active">
                    <i class="ph ph-list-bullets text-xl text-sc-teal w-6"></i>
                    <span class="flex-1 text-sm">メニュー・料金</span>
                    <span class="text-xs text-zinc-500">5件</span>
                    <i class="ph ph-caret-right text-zinc-400"></i>
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3.5 touch-active">
                    <i class="ph ph-users text-xl text-sc-teal w-6"></i>
                    <span class="flex-1 text-sm">スタッフ管理</span>
                    <span class="text-xs text-zinc-400">Team プラン以上</span>
                    <i class="ph ph-caret-right text-zinc-400"></i>
                </a>
            </section>

            <!-- 連携 -->
            <p class="px-4 py-2 text-xs text-zinc-500 font-bold mt-4">連携</p>
            <section class="bg-white border-y border-zinc-200 divide-y divide-zinc-100">
                <a href="#" class="flex items-center gap-3 px-4 py-3.5 touch-active">
                    <i class="ph ph-chat-circle text-xl text-sc-teal w-6"></i>
                    <span class="flex-1 text-sm">LINE 公式アカウント</span>
                    <span class="text-xs font-bold text-sc-teal">連携済</span>
                    <i class="ph ph-caret-right text-zinc-400"></i>
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3.5 touch-active">
                    <i class="ph ph-google-logo text-xl text-sc-teal w-6"></i>
                    <span class="flex-1 text-sm">Google ビジネス</span>
                    <span class="text-xs text-zinc-400">未連携</span>
                    <i class="ph ph-caret-right text-zinc-400"></i>
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3.5 touch-active">
                    <i class="ph ph-credit-card text-xl text-sc-teal w-6"></i>
                    <span class="flex-1 text-sm">決済（Stripe）</span>
                    <span class="text-xs text-zinc-400">未連携</span>
                    <i class="ph ph-caret-right text-zinc-400"></i>
                </a>
            </section>

            <!-- 通知・その他 -->
            <p class="px-4 py-2 text-xs text-zinc-500 font-bold mt-4">通知・アカウント</p>
            <section class="bg-white border-y border-zinc-200 divide-y divide-zinc-100">
                <div class="flex items-center gap-3 px-4 py-3.5">
                    <i class="ph ph-bell text-xl text-sc-teal w-6"></i>
                    <span class="flex-1 text-sm">予約通知</span>
                    <div class="w-11 h-6 rounded-full bg-sc-teal p-0.5 flex items-center justify-end">
                        <div class="w-5 h-5 rounded-full bg-white shadow"></div>
                    </div>
                </div>
                <div class="flex items-center gap-3 px-4 py-3.5">
                    <i class="ph ph-megaphone text-xl text-sc-teal w-6"></i>
                    <span class="flex-1 text-sm">配信レポート</span>
                    <div class="w-11 h-6 rounded-full bg-zinc-300 p-0.5 flex items-center">
                        <div class="w-5 h-5 rounded-full bg-white shadow"></div>
                    </div>
                </div>
                <a href="#" class="flex items-center gap-3 px-4 py-3.5 touch-active">
                    <i class="ph ph-credit-card text-xl text-sc-teal w-6"></i>
                    <span class="flex-1 text-sm">プラン・お支払い</span>
                    <span class="text-xs text-zinc-500">Solo（無料）</span>
                    <i class="ph ph-caret-right text-zinc-400"></i>
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3.5 touch-active">
                    <i class="ph ph-question text-xl text-sc-teal w-6"></i>
                    <span class="flex-1 text-sm">ヘルプ・FAQ</span>
                    <i class="ph ph-caret-right text-zinc-400"></i>
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3.5 touch-active">
                    <i class="ph ph-sign-out text-xl text-zinc-500 w-6"></i>
                    <span class="flex-1 text-sm text-zinc-700">ログアウト</span>
                </a>
            </section>

            <p class="text-center text-xs text-zinc-400 mt-6 mb-4">Secleva v1.0.0</p>
        </div>

        <nav class="h-[84px] bg-white border-t border-zinc-200 absolute bottom-0 w-full flex justify-around items-start pt-2 px-2 z-50 pb-[20px]">
            <a href="admin.html" class="flex flex-col items-center justify-center w-full touch-active text-zinc-400">
                <i class="ph ph-house text-2xl mb-1"></i>
                <span class="text-[10px] font-bold">ホーム</span>
            </a>
            <a href="reservations.html" class="flex flex-col items-center justify-center w-full touch-active text-zinc-400">
                <i class="ph ph-calendar-blank text-2xl mb-1"></i>
                <span class="text-[10px] font-bold">予約</span>
            </a>
            <a href="customers.html" class="flex flex-col items-center justify-center w-full touch-active text-zinc-400">
                <i class="ph ph-users text-2xl mb-1"></i>
                <span class="text-[10px] font-bold">顧客</span>
            </a>
            <a href="karte.html" class="flex flex-col items-center justify-center w-full touch-active text-zinc-400">
                <i class="ph ph-folder text-2xl mb-1"></i>
                <span class="text-[10px] font-bold">カルテ</span>
            </a>
            <button class="flex flex-col items-center justify-center w-full touch-active text-sc-teal">
                <i class="ph-fill ph-gear text-2xl mb-1"></i>
                <span class="text-[10px] font-bold">設定</span>
            </button>
        </nav>
    </main>
</body>
</html>
